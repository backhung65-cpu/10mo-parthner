<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 동향 10월호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 흰 여백 위에서 위쪽 탭으로 영역을 옮겨 다니는 브리핑 서비스. 색은 홈 히어로의 빛과 가는 선에만 쓴다. */
:root {
  --bg: #FFFFFF;
  --ink: #0A1020;
  --navy: #111827;
  --body: #334155;
  --muted: #64748B;
  --line: #E2E8F0;
  --soft: #F8FAFC;
  --blue: #1580FD;
  --deep: #154FDF;
  --fusion: linear-gradient(115deg, #EA48E1 0%, #FA8AF9 18%, #A8AEFE 48%, #6496FD 68%, #1580FD 84%, #154FDF 100%);
  --sans: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--body); font-family: var(--sans); font-size: 16px; line-height: 1.62; letter-spacing: -0.012em; padding-inline: max(16px, 4vw); word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
a { color: var(--deep); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--blue); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1120px; margin-inline: auto; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1, h2, h3 { color: var(--navy); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(36px, 5.4vw, 60px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.1; }
h2 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; }
p { margin: 0; }

/* header + nav */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, 4vw)); padding-inline: max(16px, 4vw); }
.bar .in { max-width: 1120px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--navy); font-size: 15px; letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
.brand img { height: 28px; width: auto; display: block; }
.brand span small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1 0 100%; min-width: 0; order: 3; margin-inline: -12px; padding-inline: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { appearance: none; background: none; border: 0; font: inherit; font-size: 14px; font-weight: 700; letter-spacing: -0.015em; color: var(--muted); padding: 10px 12px 12px; cursor: pointer; white-space: nowrap; border-radius: 8px 8px 0 0; position: relative; }
.tabs button:hover { color: var(--navy); background: var(--soft); }
.tabs button[aria-current="page"] { color: var(--navy); }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px; background: var(--fusion); }
.search { flex: 0 0 220px; margin-left: auto; }
.search input { width: 100%; font: inherit; font-size: 14px; color: var(--navy); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
.search input::placeholder { color: var(--muted); }

/* hero */
.hero { position: relative; isolation: isolate; padding-block: clamp(36px, 7vw, 80px) clamp(40px, 6vw, 72px); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; gap: 24px; }
.hero .field { position: absolute; z-index: -1; pointer-events: none; border-radius: 50%; filter: blur(70px); }
.hero .f1 { width: 400px; height: 400px; right: 14%; top: 2%; background: rgba(234,72,225,.28); }
.hero .f2 { width: 400px; height: 400px; right: -6%; top: 20%; background: rgba(21,128,253,.24); }
.hero .f3 { width: 340px; height: 240px; right: 8%; top: 16%; background: rgba(168,174,254,.32); }
.hero h1 { margin-top: 18px; }
.hero .sub { margin-top: 20px; font-size: clamp(17px, 2vw, 20px); line-height: 1.55; max-width: 30em; letter-spacing: -0.02em; }
.hero .from { margin-top: 24px; font-size: 14px; color: var(--muted); }
.hero .from b { color: var(--navy); }
.hero .logo { justify-self: center; width: min(100%, 400px); }
.hero .logo img { width: 100%; height: auto; display: block; }

/* blocks */
.sec { padding-block: clamp(36px, 5vw, 60px); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sechead .more { font-size: 14px; font-weight: 700; }
.lead { font-size: clamp(18px, 2.1vw, 21px); line-height: 1.5; color: var(--navy); font-weight: 500; letter-spacing: -0.025em; max-width: 36em; }
.key { position: relative; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px 18px 26px; color: var(--navy); }
.key::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; border-radius: 12px 0 0 12px; background: linear-gradient(180deg, #EA48E1, #A8AEFE 48%, #1580FD); }
.key .t { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.key p { font-size: 15.5px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

/* domain index */
.dom { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--navy); }
.dom button { appearance: none; text-align: left; font: inherit; background: none; border: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 18px 18px 20px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--body); }
.dom button:nth-child(4n) { border-right: 0; }
.dom button:hover { background: var(--soft); }
.dom .n { font-weight: 800; color: var(--navy); font-size: 17px; letter-spacing: -0.02em; }
.dom .d { font-size: 13.5px; line-height: 1.5; }
.dom .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* item rows */
.list { border-top: 1px solid var(--navy); }
.item { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 28px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.item .dt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy); font-size: 15px; padding-top: 2px; }
.item .dt small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.item h3 { font-size: 18px; }
.item .sum { margin-top: 6px; font-size: 15.5px; max-width: 46em; }
.item .imp { margin-top: 10px; font-size: 14.5px; color: var(--navy); max-width: 46em; padding-left: 12px; border-left: 2px solid var(--line); }
.item .imp b { font-weight: 700; margin-right: 4px; }
.item .go { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 700; }
.item .fl { margin-top: 8px; font-size: 13px; color: var(--body); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--navy); color: var(--navy); white-space: nowrap; }
.pill.soft { border-color: var(--line); color: var(--muted); background: var(--soft); }
.pill.dash { border-style: dashed; border-color: var(--muted); color: var(--body); }
.pill.blue { border-color: var(--deep); color: var(--deep); }
.pill.on { background: var(--navy); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { appearance: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--body); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chips button:hover { border-color: var(--deep); }
.chips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.viewhead { display: flex; flex-direction: column; gap: 14px; padding-block: clamp(32px, 5vw, 56px) 8px; }
.empty { padding-block: 28px; color: var(--muted); }

/* calendar */
.cal { border-top: 1px solid var(--navy); }
.cal .r { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; gap: 4px 24px; padding-block: 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
.cal .d { font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
.cal .t { color: var(--navy); }
.cal .t small { display: block; color: var(--muted); font-size: 13px; }
.cal .l { font-size: 13.5px; font-weight: 700; }
.und { display: flex; flex-direction: column; }
.und .r { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 24px; padding-block: 14px; border-bottom: 1px solid var(--line); align-items: baseline; }

/* sources */
.src { border-top: 1px solid var(--navy); }
.src .r { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 10px; border-bottom: 1px solid var(--line); align-items: baseline; font-size: 14.5px; }
.src .g { font-weight: 700; color: var(--navy); font-size: 13px; }
.note { font-size: 14px; color: var(--muted); max-width: 46em; }
.note b { color: var(--navy); }

.foot { border-top: 1px solid var(--line); position: relative; margin-top: 24px; padding-block: 36px 56px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; }
.foot::before { content: ""; position: absolute; left: 0; top: -1px; width: 160px; height: 2px; background: var(--fusion); border-radius: 2px; }
.foot .who { display: flex; align-items: center; gap: 12px; color: var(--navy); font-weight: 700; }
.foot .who img { height: 34px; width: auto; }
.foot p { font-size: 13px; color: var(--muted); max-width: 38em; }

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero .field { opacity: .55; }
  .hero .logo { order: -1; justify-self: start; width: min(70%, 280px); }
  .dom { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dom button:nth-child(4n) { border-right: 1px solid var(--line); }
  .dom button:nth-child(2n) { border-right: 0; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .search { flex-basis: 150px; }
}
@media (max-width: 640px) {
  .bar .in { gap: 6px 12px; }
  .brand span small { display: none; }
  .search { flex: 1 1 140px; order: 2; }
  .item { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .item .dt small { display: inline; margin-left: 6px; }
  .cal .r, .und .r { grid-template-columns: minmax(0, 1fr); }
  .src .r { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

<div class="wrap">
  <div class="bar"><div class="in">
    <button class="brand" type="button" data-go="home" aria-label="홈으로"><img data-logo alt=""><span>AI 동향 10월호<small>목회 AI 연구소 · 파트너 전용</small></span></button>
    <nav class="tabs" id="tabs" aria-label="영역"></nav>

  </div></div>

  <main id="view"></main>

  <footer class="foot">

</div>

var ITEMS = [{"id": "llm-0", "d": "llm", "k": "release", "st": "", "date": "2026-09-28", "when": "", "t": "Claude 5.5 계열, 9월에 세 번 출시", "src": "Claude Help Center 릴리스 노트", "url": "https://support.claude.com/en/articles/12138966-release-notes", "tier": "official", "s": "Anthropic은 9월 1일 Fable 5.1·Mythos 5.1, 22일 Opus 5.5, 28일 Sonnet 5.5를 잇달아 내놓았습니다. 공식 릴리스 노트는 Opus 5.5가 대부분의 업무에서 Fable 5.1 수준이면서 실행 비용은 Opus 5보다 40% 낮다고 설명합니다. 일부 집계 사이트는 Sonnet 5.5 요금을 100만 토큰당 2달러/10달러로 전하지만 공식 확인은 하지 못해 싣지 않았습니다.", "imp": "설교·성경공부 도구를 만드는 파트너는 모델 등급별 가격 차이가 커져 용도별 모델 분리 설계가 유리해졌습니다.", "tags": ["Anthropic", "Claude", "가격"], "fl": []}, {"id": "llm-1", "d": "llm", "k": "release", "st": "", "date": "2026-09-23", "when": "", "t": "ChatGPT 음성 플러그인 지원, 아시아 7개국 광고 확대", "src": "Releasebot (OpenAI 릴리스 노트)", "url": "https://releasebot.io/updates/openai", "tier": "agg", "s": "9월 23일 ChatGPT 음성 모드가 웹·iOS·Android에서 플러그인을 지원하고 Work에서 문서·발표자료·스프레드시트 작성에도 쓸 수 있게 되었습니다. 같은 날 ChatGPT 광고가 인도네시아, 말레이시아, 필리핀, 싱가포르, 태국, 베트남, 대만 등 7개 시장으로 확대되어 60개국 이상에서 제공됩니다. 28일에는 Health 탭에 연결된 건강 데이터 요약 기능이 추가되었습니다.", "imp": "무료 ChatGPT에 광고가 확산되고 음성 업무 기능이 강화되어, 목회 현장의 음성 비서 활용과 사용자 안내 방식을 함께 점검할 필요가 있습니다.", "tags": ["OpenAI", "ChatGPT", "음성", "광고"], "fl": []}, {"id": "llm-2", "d": "llm", "k": "release", "st": "", "date": "2026-09-22", "when": "", "t": "OpenAI GPT-6 Sol·Luna 출시, API 가격 절반", "src": "TechCrunch", "url": "https://techcrunch.com/2026/09/22/openai-launches-gpt-6-sol-and-luna/", "tier": "press", "s": "OpenAI가 9월 22일 복잡한 코딩용 GPT-6 Sol과 사무용 GPT-6 Luna를 공개했습니다. API 가격은 이전 5.6 시리즈의 절반 수준이며 사실성 평가 오류가 약 절반으로 줄었다고 합니다. Luna는 무료·Go 사용자도 쓸 수 있고, 집계 사이트 기준 Sol은 100만 토큰당 2달러/10달러, Luna는 0.10달러/0.50달러입니다.", "imp": "저렴해진 Luna급 모델 덕분에 교회·사역 도구에 챗봇을 붙이는 비용 부담이 크게 낮아졌습니다.", "tags": ["OpenAI", "GPT-6", "가격"], "fl": ["API 가격은 집계 사이트 기준입니다."]}, {"id": "llm-3", "d": "llm", "k": "release", "st": "", "date": "2026-09-22", "when": "", "t": "업스테이지 Solar Mini 4 출시, 10월 22일까지 50% 할인", "src": "Upstage Console / Digital Applied", "url": e/", "tier": "agg", "s": "7월 19일 공개된 2.4조 파라미터 Qwen 3.8은 오픈 웨이트를 곧 내놓겠다고 했지만 구체적인 날짜는 없습니다. 10월 공개 여부는 불확실합니다.", "imp": "오픈 웨이트가 풀리면 자체 호스팅형 사역 AI 구축 선택지가 넓어집니다.", "tags": ["중국", "Qwen", "오픈웨이트"], "fl": []}, {"id": "agents-0", "d": "agents", "k": "release", "st": "", "date": "2026-09-29", "when": "", "t": "GitHub Copilot에 GPT-6.1 Sol 정식 제공", "src": "GitHub Changelog", "url": "https://github.blog/changelog/2026-09-29-gpt-6-1-sol-in-github-copilot/", "tier": "official", "s": "GitHub가 에이전트형 코딩과 터미널 작업에 최적화된 OpenAI GPT-6.1 Sol을 Copilot Pro+, Max, Business, Enterprise 사용자에게 정식 제공했습니다. 초기 테스트에서 이전 모델보다 적은 토큰과 단계로 작업을 완료했다고 합니다. 사용량 기반 과금이며 점진적으로 배포됩니다.", "imp": "Copilot을 쓰는 사역 개발 파트너는 모델 선택지가 늘고 비용이 사용량에 연동되므로 예산 관리가 필요합니다.", "tags": ["GitHub Copilot", "GPT-6.1", "코딩 에이전트"], "fl": []}, {"id": "agents-1", "d": "agents", "k": "release", "st": "", "date": "2026-09-28", "when": "", "t": "Claude Sonnet 5.5, GitHub Copilot에서 정식 출시", "src": "GitHub Changelog", "url": "https://github.blog/changelog/2026-09-28-claude-sonnet-5-5-in-github-copilot/", "tier": "official", "s": "Anthropic의 최신 Sonnet 모델인 Claude Sonnet 5.5가 Copilot Pro 이상 전 플랜에서 정식 제공됩니다. Sonnet 5와 코딩 성능은 비슷하면서 단계, 토큰, 도구 호출이 크게 줄었다고 GitHub는 밝혔습니다. VS Code, JetBrains, Xcode 등에서 선택할 수 있습니다.", "imp": "일상적인 기능 개발과 버그 수정에는 더 저렴하고 빠른 모델을 쓸 수 있어 소규모 사역 앱 개발 비용에 도움이 됩니다.", "tags": ["Claude", "GitHub Copilot"], "fl": []}, {"id": "agents-2", "d": "agents", "k": "news", "st": "", "date": "2026-09-28", "when": "", "t": "Dreamforce 2026: Agentforce Coworker와 장기 실행 에이전트 공개", "src": "Salesforce", "url": "https://www.salesforce.com/blog/dreamforce-2026-announcements/", "tier": "official", "s": "Salesforce는 며칠에서 몇 달까지 목표를 추적하는 장기 실행 에이전트, 자연어로 여러 에이전트를 조율하는 Agentforce Coworker, 다중 에이전트 Superagent 프레임워크를 발표했습니다. 자체 CRM 추론 모델 Koa는 현재 파일럿이고 정식 출시는 Winter 2026 예정이며, 에이전트를 만드는 Agent Optimizer도 소개했습니다.", "imp": "교인 관리나 후원자 CRM에 에이전트를 붙이려는 사역 파트너가 참고할 엔터프라이즈 에이전트 기준선입니다.", "tags": ["Agentforce", "엔터프라이즈", "Dreamforce"], "fl": []}, {"id": "agents-3", "d": "agents", "k": "news", "st": "", "date": "2026-09-28", "when": "", "t": "Salesforce, MCP 서버 위험 점수와 Security Mesh 도입", "src": "Salesforce", "url": "https://www.salesforce.com/blog/dreamforce-2026-top-it-announcements/", "tier": "official", "s": "Salesforce는 에이전트 등록 시 외부 MCP 서버를 자동 검사해 프롬프트 인젝션과 도구 오염 위험을 낮음, 중간, 높음으로 평가하는 MCP Risk Scores를 발표했습니다. 여러 플랫폼의 보안 텔레메트리를 통합하는 Security Mesh와 Builder Central 베타, AIforce 인터페이스 계층도 함께 공개했습니다.", "imp": "외부 MCP 서버를 연결할 때 사전 위험 점검이 표준 기능이 되어 간다는 신호입니다.", "tags": ["MCP", "보안", "Agentforce"], "fl": []}, {"id": "agents-4", "d": "agents", "k": "release", "st": "", "date": "2026-09-22", "when": "", "t": "Claude Opus 5.5 출시, 가격 인하와 에이전트 성능 강화", "src": "Anthropic", "url": "https://www.anthropic.com/claude-opus-5-5", "tier": "official", "s": "Anthropic이 Claude Opus 5.5를 출시했습니다. 입력 100만 토큰당 4달러, 출력 20달러로 Opus 5보다 20% 저렴하고 출력 속도는 30% 이상 빨라졌으며 AWS, Google Cloud, Azure에서도 쓸 수 있습니다. 에이전트형 코딩, 컴퓨터 사용, 지식 업무에서 앞선다고 밝혔습니다.", "imp": "고성능 에이전트 모델의 단가가 내려가 목회 AI 도구에 붙이는 비용 부담이 줄어듭니다.", "tags": ["Claude Opus 5.5", "Claude Code", "가격"], "fl": []}, {"id": "agents-5", "d": "agents", "k": "release", "st": "", "date": "2026-09-22", "when": "", "t": "OpenAI GPT-6 Sol과 Luna, Copilot에 도입", "src": "GitHub Changelog", "url": "https://github.blog/changelog/2026-09-22-openais-gpt-6-sol-and-gpt-6-luna-now-available/", "tier": "official", "s": "GPT-6 Sol은 대화형·에이전트형 코딩용 균형 모델, GPT-6 Luna는 작은 작업용 저비용 모델로 Copilot에 추가되었습니다. Business와 Enterprise는 관리자가 정책으로 접근을 제어하며 기본값은 활성화입니다. 모두 사용량 기반 과금입니다.", "imp": "조직 단위로 Copilot을 도입한 교회나 기관은 새 모델이 기본 활성화된다는 점을 확인해야 합니다.", "tags": ["OpenAI", "GPT-6", "Copilot"], "fl": []}, {"id": "agents-6", "d": "llm", "k": "release", "st": "", "date": "2026-09-22", "when": "", "t": "OpenAI GPT-6 Astra 롤아웃, Codex 컨텍스트 보존 기능 포함", "src": "OpenAI", "url": "https://openai.com/index/gpt-6-astra/", "tier": "official", "s": "OpenAI 공식 페이지에 따르면 GPT-6 Astra는 9월 22일부터 일부 조직에 먼저 제공되고 ChatGPT 유료 플랜으로 확대되며, API 가격은 입력 10달러, 출력 50달러입니다. 긴 디버깅 세션에서 컨텍스트가 가득 차도 검색 가능한 노트를 유지하는 기능이 Codex 에이전트에 들어갔습니다. 허가된 작업 경계를 우회하는 비율이 0%라고 OpenAI는 주장합니다.", "imp": "장시간 에이전트 작업의 맥락 유실 문제를 줄이는 방향으로, 긴 글 작업 워크플로 설계에 참고할 만합니다.", "tags": ["Codex", "GPT-6 Astra"], "fl": ["날짜 충돌: 일부 집계·보도는 9월 3~4일 제한 프리뷰로 전합니다. OpenAI 공식 페이지의 9월 22일 롤아웃 기준으로 표기했습니다."]}, {"id": "agents-7", "d": "agents", "k": "release", "st": "", "date": "2026-09-25", "when": "", "t": "Copilot 주간 릴리스: 로컬 샌드박스와 에이전트 모니터링", "src": "GitHub Changelog", "url": "https://github.blog/changelog/2026-09-25-github-copilot-weekly-releases-september-21/", "tier": "official", "s": "Copilot 앱에 에이전트의 파일, 네트워크, 자격 증명 접근을 제한하는 로컬 샌드박싱이 공개 프리뷰로 들어왔습니다. JetBrains의 저위험 작업 자동 승인, VS Code 1.139의 Dev Container 에이전트 실행, OpenTelemetry 기반 에이전트 활동 추적도 추가됐습니다. Claude Opus 5.5, GPT-6 Sol, Luna, Grok 4.7도 모델 목록에 들어왔습니다.", "imp": "에이전트 권한을 제한하고 감사하는 기능이 기본 제공되어 외부 개발 파트너에게 요구할 보안 기준이 됩니다.", "tags": ["Copilot", "샌드박스", "보안"], "fl": []}, {"id": "agents-8", "d": "agents", "k": "release", "st": "", "date": "2026-09-25", "when": "", "t": "GitHub agentic autofix, Copilot Memory 활용 시작", "src": "GitHub Changelog", "url": "https://github.blog/changelog/2026-09-25-agentic-autofix-now-uses-copilot-memory/", "tier": "official", "s": "보안 경고를 자동으로 고치는 agentic autofix가 Copilot Memory에 저장된 저장소 맥락을 참고하고, 성공한 수정 패턴을 다시 기억으로 저장합니다. 두 기능 모두 공개 프리뷰이며 코드 리뷰와 클라우드 에이전트 등 다른 기능에도 지식이 공유됩니다.", "imp": "에이전트가 저장소별 맥락을 기억하는 흐름이 보안 수정으로 확장되고 있다는 사례입니다.", "tags": ["Copilot Memory", "보안 자동수정"], "fl": []}, {"id": "agents-9", "d": "agents", "k": "release", "st": "", "date": "2026-09-18", "when": "", "t": "AWS AgentCore Runtime 신규 버전 정식 출시", "src": "AWS", "url": "https://aws.amazon.com/about-aws/whats-new/2026/09/new-agentcore-runtime-generally-available/", "tier": "official", "s": "AWS가 차세대 AgentCore Runtime을 정식 출시했습니다. 사용하지 않는 메모리를 회수해 최대치가 아닌 실사용량만 과금하고, 스냅샷 복원으로 콜드 스타트 P75를 기존 5.4~30초에서 약 2초로 줄였습니다. 5개 리전에서 platformVersion을 V2로 지정해 사용합니다.", "imp": "에이전트 호스팅 비용과 응답 지연이 낮아져 상담형 챗봇 같은 서비스를 운영하기 쉬워집니다.", "tags": ["AWS", "AgentCore"], "fl": []}, {"id": "agents-10", "d": "agents", "k": "issue", "st": "", "date": "2026-09-19", "when": "", "t": "BragJack: 악성 확장 프로그램으로 AI 브라우저 에이전트 탈취", "src": "BleepingComputer", "url": "https://www.bleepingcomputer.com/news/security/bragjack-attacks-hijack-ai-browser-agents-through-malicious-extensions/", "tier": "press", "s": "Forever Security의 Gal Weizman이 Chrome Gemini Live, Perplexity Comet, Edge, Opera Neon, Claude in Chrome의 AI 어시스턴트를 악성 확장 프로그램으로 조종할 수 있는 기법을 공개했습니다. 로컬 파일 읽기와 스크린샷 등이 가능했고 Google과 Microsoft는 패치를 완료했으며 총 2만 달러 이상의 버그 바운티가 지급되었습니다.", "imp": "AI 브라우저 에이전트를 쓰는 목회자는 신뢰할 수 없는 확장 프로그램 설치를 피해야 합니다.", "tags": ["보안", "브라우저 에이전트", "Claude in Chrome", "Comet"], "fl": ["CVE 건수 등 세부 수치가 두 기사에서 다릅니다."]}, {"id": "agents-11", "d": "agents", "k": "issue", "st": "", "date": "2026-09-16", "when": "", "t": "확장 프로그램 하나로 여러 AI 브라우저 어시스턴트 장악 가능", "src": "The Hacker News", "url": "https://thehackernews.com/2026/09/one-extension-could-hijack-ai.html", "tier": "press", "s": "두 가지 흔한 권한만으로 신뢰된 AI 벤더 페이지에 코드를 주입해 내장 AI를 제어할 수 있음이 시연되었습니다. Chrome은 CVE-2026-0628, Edge는 CVE-2026-55945로 수정되었고, Perplexity, Opera, Anthropic은 바운티만 지급하고 CVE나 패치 일정은 공개하지 않았다고 합니다.", "imp": "벤더별 대응 수준이 달라 어떤 AI 브라우저를 업무에 쓸지 판단하는 근거가 됩니다.", "tags": ["보안", "CVE", "프롬프트 포싱"], "fl": ["벤더별 CVE 공개 여부가 기사마다 다르게 전해집니다."]}, {"id": "agents-12", "d": "agents", "k": "news", "st": "", "date": "2026-08-27", "when": "", "t": "A2A 프로토콜, Agentic AI Foundation 성장 단계 프로젝트로 편입", "src": "A2A Protocol", "url": "https://a2a-protocol.org/latest/blog/2026/08/27/a-new-chapter-for-a2a-joining-the-agentic-ai-foundation/", "tier": "official", "s": "A2A가 Linux Foundation 산하 AAIF의 Growth Stage 프로젝트가 되어 MCP, goose, AGENTS.md와 같은 중립 거버넌스 아래 놓였습니다. 150개 이상 조직이 지지하며 Google Cloud, AWS AgentCore, Azure AI Foundry가 네이티브 지원합니다. 조사 기간(9월) 직전 소식이라 배경 참고용으로 포함합니다.", "imp": "에이전트 간 연동 표준이 하나의 재단으로 모여 특정 벤더에 종속될 위험이 줄어듭니다.", "tags": ["A2A", "AAIF", "프로토콜"], "fl": ["9월 이전 소식으로 배경 참고용입니다."]}, {"id": "agents-13", "d": "agents", "k": "news", "st": "", "date": "2026-07-28", "when": "", "t": "MCP 2026-07-28 사양: 무상태 코어와 인증 강화", "src": "Model Context Protocol Blog", "url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/", "tier": "official", "s": "세션과 핸드셰이크가 없는 무상태 코어, 헤더 기반 라우팅, 캐시 가능한 목록, RFC 9207 검증과 CIMD 중심 인증이 포함됐습니다. Roots, Sampling, Logging은 폐기 예정이며 최소 12개월의 유예 정책이 명문화되었습니다. 9월 이후 도입 확산의 기준이 되는 사양이라 배경으로 포함합니다.", "imp": "MCP 서버를 직접 운영하는 파트너는 이전 시기를 고려해 무상태 구조로의 전환을 계획할 시점입니다.", "tags": ["MCP", "사양"], "fl": ["9월 이전 소식으로 배경 참고용입니다."]}, {"id": "agents-14", "d": "agents", "k": "outlook", "st": "inference", "date": "2026-10-15", "when": "10월 중 (시점 미정)", "t": "MCP 신규 사양 도입 확산 예상", "src": "Model Context Protocol Blog", "url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/", "tier": "official", "s": "2026-07-28 사양은 폐기 정책에 최소 12개월 유예를 두었고, GitHub 등 주요 서버가 이미 다음 사양 지원을 밝혔습니다. 10월 중 SDK와 클라이언트의 대응 발표가 이어질 가능성이 있으나 구체 일정은 확인하지 못했습니다.", "imp": "연동 중인 MCP 서버와 클라이언트의 지원 버전을 미리 점검해 두면 좋습니다.", "tags": ["MCP", "전망"], "fl": []}, {"id": "agents-15", "d": "agents", "k": "outlook", "st": "confirmed", "date": "2026-10-01", "when": "일정 미정", "t": "Salesforce Koa 추론 모델과 Builder Central 후속 일정", "src": "Salesforce", "url": "https://www.salesforce.com/blog/dreamforce-2026-announcements/", "tier": "official", "s": "Koa는 파일럿이 진행 중이며 정식 출시는 Winter 2026으로 예고되었습니다. IT 발표 글에서는 Builder Central 베타 등 일부 항목이 10월 이후 제공된다고 안내합니다.", "imp": "Salesforce 기반 CRM을 쓰는 기관은 연말 전후 신기능 도입 시점을 잡아볼 수 있습니다.", "tags": ["Salesforce", "전망"], "fl": []}, {"id": "agents-16", "d": "agents", "k": "outlook", "st": "inference", "date": "2026-10-10", "when": "10월 중 (시점 미정)", "t": "GPT-6 계열 모델의 순차 확대와 Copilot 관리자 정책", "src": "GitHub Changelog", "url": "https://github.blog/changelog/2026-09-29-gpt-6-1-sol-in-github-copilot/", "tier": "official", "s": "GPT-6.1 Sol은 점진적으로 배포 중이며 Business와 Enterprise에서는 새 모델이 기본 활성화됩니다. 10월에 더 많은 IDE와 플랜으로 확대될 가능성이 있으나 구체적 날짜는 확인하지 못했습니다.", "imp": "조직 관리자는 모델 정책과 사용량 과금 한도를 미리 정해 두는 편이 안전합니다.", "tags": ["Copilot", "전망"], "fl": []}, {"id": "image-0", "d": "image", "k": "release", "st": "", "date": "2026-09-24", "when": "", "t": "Midjourney, 스타일 미리보기·편집 모델 개선 (9/24 업데이트)", "src": "Releasebot (Midjourney 릴리스 노트)", "url": "https://releasebot.io/updates/midjourney", "tier": "agg", "s": "9월 24일 Midjourney는 Styles 사이드바의 실시간 스타일 미리보기, 편집 모델의 인페인팅·아웃페인팅 개선, 타일 이미지 간 이음새 개선을 내놓았습니다. 앞서 9월 23일 알파 변경 목록에는 midjourney.com 전체의 한국어 지원, 새 Create 피드, 검색 개선이 포함됐습니다.", "imp": "웹 사이트가 한국어를 지원해 목회자도 진입 장벽 없이 포스터·카드뉴스용 이미지를 만들고 부분 수정할 수 있게 됐습니다.", "tags": ["Midjourney", "한국어", "이미지편집"], "fl": []}, {"id": "image-1", "d": "image", "k": "news", "st": "", "date": "2026-09-23", "when": "", "t": "Black Forest Labs, 로봇용 오픈웨이트 모델 FLUX 3 Action 공개", "src": "VentureBeat", "url": "https://venturebeat.com/infrastructure/black-forest-labs-debuts-flux-3-action-an-open-weights-ai-robotics-model-that-tops-the-leaderboard-at-half-the-size-of-its-competition", "tier": "press", "s": "Black Forest Labs가 70억 파라미터 오픈웨이트 월드 액션 모델 FLUX 3 Action을 공개했습니다. NVIDIA RoboLab-120 벤치마크에서 42.92%로 공개 리더보드 1위를 기록했다고 합니다. 회사가 이미지 생성에서 피지컬 AI로 무게중심을 옮기는 신호입니다.", "imp": "교회 디자인용 이미지 모델 소식은 아니며, FLUX 계열 업체의 방향이 이미지에서 로봇으로 이동 중이라는 참고 정보입니다.", "tags": ["FLUX", "Black Forest Labs", "오픈웨이트"], "fl": []}, {"id": "image-2", "d": "image", "k": "release", "st": "", "date": "2026-09-21", "when": "", "t": "Alibaba Qwen-Image-2.1 공개: 7B, 투명 배경, 참조 이미지 10장", "src": "MarkTechPost", "url": "https://www.marktechpost.com/2026/09/21/alibaba-qwen-releases-qwen-image-2-1/", "tier": "press", "s": "Qwen-Image-2.1은 생성과 편집을 하나로 합친 7B 오픈웨이트 모델로, 투명 배경(RGBA) 이미지를 직접 생성·편집하고 최대 10장의 참조 이미지로 편집할 수 있습니다. 라이선스는 Qwen Research License이며 상업적 배포에는 별도 라이선스가 필요합니다.", "imp": "투명 PNG 소재를 만들기 쉬워 주보·카드뉴스 소재 제작에 유용하지만, 상업 사용 라이선스 제한을 먼저 확인해야 합니다.", "tags": ["Qwen-Image", "투명배경", "오픈웨이트", "라이선스"], "fl": []}, {"id": "image-3", "d": "image", "k": "release", "st": "", "date": "2026-09-18", "when": "", "t": "Adobe Firefly 9월 업데이트: GPT Image 2 비율 10종, 프롬프트 길이 확대", "src": "Adobe Community", "url": "https://community.adobe.com/announcements-402/what-s-new-in-adobe-firefly-september-2026-1642552", "tier": "official", "s": "Firefly 웹과 Boards에서 GPT Image 2가 지원하는 화면 비율이 3종에서 10종으로 늘었고, 이미지·영상 생성의 프롬프트 글자 수 제한도 확대됐습니다. 영상 배경 제거와 Kling 3.0 Omni 참조 이미지 지원도 추가됐습니다.", "imp": "다양한 비율을 지원해 포스터, 세로형 카드뉴스, 유튜브 썸네일 규격에 맞춰 바로 생성하기 편해졌습니다.", "tags": ["Adobe Firefly", "화면비율", "GPT Image 2"], "fl": []}, {"id": "image-4", "d": "image", "k": "release", "st": "", "date": "2026-09-10", "when": "", "t": "BFL, FLUX 3 Video에 2K·4K 출력 추가", "src": "Black Forest Labs 문서", "url": "https://docs.bfl.ml/release-notes", "tier": "official", "s": "9월 10일 FLUX 3 Video가 QHD(2560x1440)와 UHD(3840x2176) 출력을 지원하기 시작했습니다. 초당 요금은 QHD 0.40달러, UHD 0.80달러입니다. 해상도와 무관하게 장면 내용은 바뀌지 않습니다.", "imp": "영상 모델이지만 예배 배경 영상이나 설교 영상 소재를 고해상도로 만들 때 참고할 수 있습니다.", "tags": ["FLUX", "영상", "4K"], "fl": []}, {"id": "image-5", "d": "image", "k": "release", "st": "", "date": "2026-09-08", "when": "", "t": "OpenAI GPT Image 2.5 (ChatGPT Images 2.5) 출시", "src": "Analytics Vidhya", "url": "https://www.analyticsvidhya.com/blog/2026/09/chatgpt-images-2-5-features-explained/", "tier": "agg", "s": "ChatGPT Images 2.5는 생성보다 편집에 초점을 맞춰 참조 이미지 유지, 부분 정밀 편집, 다중 턴 일관성을 강화했고, 러프 레이아웃을 그리는 Sketch, 포스터·굿즈용 Templates, 프롬프트 공유 기능을 추가했습니다. 지연 시간은 최대 50% 줄었고 API는 Flare(빠름)와 Sunburst(고급) 두 종류입니다.", "imp": "스케치로 배치를 잡고 포스터 템플릿으로 시작할 수 있어 비디자이너 목회자의 주보·포스터 작업에 특히 실용적입니다.", "tags": ["OpenAI", "GPT Image 2.5", "포스터", "편집"], "fl": ["제3자 해설 글이 출처이며 날짜는 위키 등 보조 자료 기준입니다."]}, {"id": "image-6", "d": "image", "k": "release", "st": "", "date": "2026-09-01", "when": "", "t": "Canva 9월 신기능: URL로 브랜드킷 자동 생성, 손그림 프레임", "src": "Canva Design School", "url": "https://www.canva.com/design-school/resources/whats-new-canva-sep26/", "tier": "official", "s": "Canva 2026년 9월 소개 자료에는 웹사이트 URL로 브랜드킷을 자동 생성하는 기능, 손으로 그린 도형을 이미지 프레임으로 바꾸는 기능, 디자인에 결제 링크를 넣는 PayPal 연동이 포함됩니다. 스프레드시트로 AI 데이터 대시보드를 만드는 기능도 있습니다. 페이지에 정확한 출시일은 없어 9월 업데이트로만 표기합니다.", "imp": "교회 웹사이트 주소  제품명으로 통합될 가능성도 있습니다.", "imp": "Veo 4를 전제로 계획을 세우지 말고 현재 Veo 3.1과 Omni 기반으로 시험해 보는 것이 현실적입니다.", "tags": ["Veo", "Google", "루머"], "fl": []}, {"id": "papers-0", "d": "papers", "k": "paper", "st": "", "date": "2026-09-29", "when": "", "t": "CoEM: 증거 확정형 메모리로 장문 추론 강화", "src": "arXiv", "url": "http://arxiv.org/abs/2609.36935", "tier": "official", "s": "논문 'CoEM: Empowering Long-Context Reasoning with Commit-on-Evidence Memory'(Jingguang Li 외)는 원문 발췌를 보류 집합에 보관하다가 학습된 정책이 확정·유지·폐기를 결정하고, 고정 검증기가 사실을 대조하는 3단 구조를 제안한다. 6,400개 문서 입력에서 Qwen3.5-9B 기준 기존 메모리 방식보다 F1이 10.4~11.4점 높았다.", "imp": "긴 성경 주석이나 설교 자료를 다루는 목회 AI 도구에서 근거 기반 기억과 환각 감소 설계의 참고가 된다.", "tags": ["reasoning", "long-context", "memory", "hallucination"], "fl": []}, {"id": "papers-1", "d": "papers", "k": "news", "st": "", "date": "2026-09-23", "when": "", "t": "Anthropic, 파지 DNA에서 CRISPR 유사 효소계 발견 발표", "src": "TechCrunch / Anthropic", "url": "https://techcrunch.com/2026/09/23/anthropic-says-its-biology-lab-has-already-found-something-big/", "tier": "press", "s": "Anthropic은 Claude가 약 950개 에이전트와 2.1억 토큰을 사용해 약 21시간 만에 박테리오파지 DNA에서 DNA를 자르고 복사·붙여넣기하는 새로운 효소계를 찾았다고 밝혔다. 실험은 BSL-1/2 수준의 자사 연구소에서 사람이 수행했으며, 아모데이 CEO도 스탠퍼드가 유사한 시스템을 먼저 발견한 바 있다고 인정해 새로움은 학계 검증이 필요하다.", "imp": "AI 과학 발견 주장은 검증 전 과장될 수 있다는 점을 보여 주어, 목회자에게 AI 결과를 비판적으로 읽는 사례가 된다.", "tags": ["AI-for-science", "agents", "biology"], "fl": ["Anthropic 발표 내용이며 학계 검증이 필요합니다."]}, {"id": "papers-2", "d": "papers", "k": "news", "st": "", "date": "2026-09-17", "when": "", "t": "구글 딥마인드, AGI 논의 확장을 위한 연구소 출범", "src": "TechCrunch / Google DeepMind", "url": "https://techcrunch.com/2026/09/17/google-deepmind-launches-institute-to-widen-the-agi-debate/", "tier": "press", "s": "구글과 딥마인드가 AGI 논의를 넓히는 연구소를 세우고 섀인 레그를 편집 책임자로 두었다. 첫 에세이 네 편은 경제 정책, 사람이 읽을 수 있는 모델 추론의 보존, 인간 번영의 원칙, 프런티어 모델 평가를 다룬다. 허사비스는 출시 30일 전 모델을 자발적으로 심사받는 미국 주도 표준 기구를 제안했다.", "imp": "인간 번영과 AI 거버넌스 논의가 커지는 흐름이라 교회와 신학계가 참여할 접점을 가늠할 수 있다.", "tags": ["safety", "governance", "evaluation", "AGI"], "fl": [] gg", "s": "Claude Opus 5.5, GPT-6 Sol, GPT-6 Luna가 Write, Draft, 플러그인에서 쓸 수 있게 됐고 이전 모델보다 크레딧 소모가 적다고 안내합니다. 채팅 응답 시간은 절반으로 줄고 오류율은 30% 감소했으며, 다시쓰기는 자체 모델로 바뀌었습니다. 편집기에서 깔끔한 인쇄 기능도 복구됐습니다.", "imp": "장편 원고 집필 도구가 여러 최신 모델을 선택해 쓰는 방향으로 가고 있어 원고 작업 도구를 고를 때 비교 기준이 됩니다.", "tags": ["Sudowrite", "AI모델", "집필도구"], "fl": []}, {"id": "books-8", "d": "books", "k": "issue", "st": "", "date": "2026-09-01", "when": "", "t": "AI 표기 논의: 한국 AI기본법 시행과 EU AI법 표시 의무", "src": "뉴스핌", "url": "https://www.newspim.com/news/view/20260901000106", "tier": "press", "s": "박정인 연구교수는 한국 AI기본법이 7월 21일 시행됐고 EU AI법이 8월 2일부터 합성 콘텐츠의 기계 판독 표시를 요구한다고 정리했습니다. 아마존 KDP의 AI 보조와 AI 생성 구분, 작가조합의 인간 저작 인증도 사례로 들며 표시가 오히려 독자의 의심을 키우지 않도록 해야 한다고 지적했습니다.", "imp": "해외 출간이나 전자책 유통을 계획하는 목회자는 플랫폼별 AI 공개 기준을 미리 알아두어야 합니다.", "tags": ["AI표기", "AI기본법", "KDP"], "fl": []}, {"id": "books-9", "d": "books", "k": "news", "st": "", "date": "2026-09-29", "when": "", "t": "CCC 프랑크푸르트 도서전 패널: 출판사의 AI 가치사슬 전략", "src": "GlobeNewswire (CCC)", "url": "https://www.globenewswire.com/news-release/2026/09/29/3370831/0/en/ccc-to-host-frankfurt-book-fair-panel-on-publisher-strategies-for-navigating-the-ai-value-chain.html", "tier": "press", "s": "저작권 관리 기관 CCC가 10월 7일 프랑크푸르트 도서전에서 STM, 와일리, 프론티어스 관계자와 AI 라이선스 패널을 연다고 밝혔습니다. CCC는 AI 학습용 집단 라이선스를 제공 중입니다.", "imp": "올해 도서전의 AI 논의가 창작 지원보다 학습 데이터 라이선스에 무게가 실릴 수 있음을 보여줍니다.", "tags": ["프랑크푸르트", "라이선스"], "fl": []}, {"id": "books-10", "d": "books", "k": "outlook", "st": "confirmed", "date": "2026-10-07", "when": "10월 7일", "t": "프랑크푸르트 도서전 AI 라이선스 패널", "src": "GlobeNewswire (CCC)", "url": "https://www.globenewswire.com/news-release/2026/09/29/3370831/0/en/ccc-to-host-frankfurt-book-fair-panel-on-publisher-strategies-for-navigating-the-ai-value-chain.html", "tier": "press", "s": "10월 7일 오후 2시부터 3시(중부유럽시간) Hall 4 대화 무대에서 열립니다. 로이 카우프먼이 사회를 맡고 10월 8일에는 별도 행사에서도 발표합니다.", "imp": "출판사들의 AI 라이선스 방향을 가늠할 자리입니다.", "tags": ["프랑크푸르트", "일정"], "fl": []}, {"id": "books-11", "d": "books", "k": "outlook", "st": "confirmed", "date": "2026-11-15", "when": "11월 15일", "t": "Anthropic 합의금 첫 지급 시한", "src": "TAA Abstract blog", "url": "https://blog.taaonline.net/2026/09/next-steps-in-bartz-v-anthropic-settlement-resolving-claim-percentage-differences/", "tier": "agg", "s": "분쟁 청구 30일 정리 기간이 10월 초 끝나며, 합의된 청구의 첫 지급은 11월 15일까지 이뤄질 예정입니다.", "imp": "10월에 청구 배분 분쟁이 정리되는지 확인해야 합니다.", "tags": ["합의금", "일정"], "fl": []}, {"id": "books-12", "d": "books", "k": "outlook", "st": "inference", "date": "2026-10-31", "when": "10월 중 (시점 미정)", "t": "OpenAI 소송 추가 서면 공방 지속", "src": "The Authors Guild", "url": "https://authorsguild.org/news/ag-v-openai-top-execs-knew-mass-book-piracy-was-illegal/", "tier": "official", "s": "작가조합은 앞으로 몇 달간 추가 서면 제출이 있고 심리는 2027년 초로 예상된다고 밝혔습니다. 10월에도 관련 문서 공개나 보도가 이어질 가능성이 있습니다.", "imp": "판결 전까지 관련 소식이 계속될 수 있습니다.", "tags": ["소송", "전망"], "fl": []}, {"id": "ministry-0", "d": "ministry", "k": "news", "st": "", "date": "2026-09-28", "when": "", "t": "목데연 '한국교회 트렌드 2027' 발표, 영적 고민 AI 상담 79.9% '도움'", "src": "데일리굿뉴스", "url": "https://www.goodnews1.com/news/articleView.html?idxno=464623", "tier": "press", "s": "목회데이터연구소가 9월 28일 「한국교회 트렌드 2027」을 발표했습니다. 2026년 5~6월 목회자·성도 등 3,750명을 조사했고, AI와 신앙 상담을 경험한 개신교인의 79.9%가 도움이 됐다고 답했습니다. 직분을 원치 않는 성도가 54%, 느슨한 관계를 선호하는 성도가 68%로 나타났습니다.", "imp": "성도들이 이미 AI에 신앙 질문을 던지고 만족하고 있으므로, 교회가 이를 전제로 목양 접점을 다시 설계해야 한다.", "tags": ["목회데이터연구소", "설문", "AI 상담"], "fl": []}, {"id": "ministry-1", "d": "ministry", "k": "news", "st": "", "date": "2026-09-25", "when": "", "t": "교황 레오 14세, 프랑스 방문 중 유네스코에서 'AI와 문화의 부패' 경고", "src": "National Catholic Register", "url": "https://www.ncregister.com/cna/pope-leo-xiv-warns-of-corruption-of-culture-in-the-age-of-ai", "tier": "press", "s": "교황은 9월 25일 파리 유네스코 본부 연설에서 AI 시스템이 데이터를 연관지을 수는 있어도 삶의 의미에 관한 질문에는 답할 수 없다고 말했다. 효율로 사람을 평가하는 경향을 비판하고 아동·장애인·노인·이주민 보호를 강조했다. 이 방문은 9월 25~28일 4일 일정이었다.", "imp": "바티칸의 AI 논의가 '인간이란 무엇인가'로 모이고 있으니, 설교와 교육에서도 인간 존엄을 중심 언어로 삼을 만하다.", "tags": ["교황 레오 14세", "바티칸", "유네스코"], "fl": []}, {"id   var fl = x.fl.map(function (f) { return '<div class="fl"><b>확인 필요</b> ' + esc(f) + '</div>'; }).join('');
  return '<article class="item"><div class="dt">' + esc(d.m) + '<small>' + (d.y !== '2026' ? d.y : '2026') + '</small></div><div>' +
    '<div class="meta">' + meta.join('') + '</div>' +
    '<h3>' + esc(x.t) + '</h3><p class="sum">' + esc(x.s) + '</p>' +
    '<p class="imp"><b>시사점</b>' + esc(x.imp) + '</p>' + fl +
    '<a class="go" href="' + esc(x.url) + '" target="_blank" rel="noopener">원문 열기 ↗</a></div></article>';
}
function orow(x, showDom) {
  var st = STAT[x.st] || STAT.inference, t = TIER[x.tier];
  var meta = [];
  if (showDom) meta.push(pill(DN[x.d].n, 'on'));
  meta.push(pill(st[0], st[1]), pill(t[0], t[1]), '<span>' + esc(x.src) + '</span>');
  var fl = x.fl.map(function (f) { return '<div class="fl"><b>확인 필요</b> ' + esc(f) + '</div>'; }).join('');
  return '<article class="item"><div class="dt">' + esc(x.when.split(' (')[0].split(' · ')[0]) + '</div><div>' +
    '<div class="meta">' + meta.join('') + '</div>' +
    '<h3>' + esc(x.t) + '</h3><p class="sum">' + esc(x.s) + '</p>' +
    (x.when.indexOf('(') > -1 || x.when.indexOf('·') > -1 ? '<p class="sum" style="color:var(--muted);font-size:14px">시점: ' + esc(x.when) + '</p>' : '') +
    '<p class="imp"><b>시사점</b>' + esc(x.imp) + '</p>' + fl +
    '<a class="go" href="' + esc(x.url) + '" target="_blank" rel="noopener">원문 열기 ↗</a></div></article>';
}

function tabs() {
  var all = [{k:'home', n:'홈'}].concat(DOMS, [{k:'calendar', n:'캘린더'}, {k:'sources', n:'출처'}]);
  document.getElementById('tabs').innerHTML = all.map(function (t) {
    return '<button type="button" data-go="' + t.k + '"' + (state.view === t.k ? ' aria-current="page"' : '') + '>' + esc(t.n) + '</button>';
  }).join('');
}

function homeView() {
  var heads = HEAD.map(function (id) { return row(byId[id], true); }).join('');
  var dom = DOMS.map(function (d) {
    return '<button type="button" data-go="' + d.k + '"><span class="n">' + esc(d.n) + '</span><span class="d">' + esc(d.d) + '</span><span class="c">' + past(d.k).length + '건 · 전망 ' + outl(d.k).length + '건</span></button>';
  }).join('');
  var cal = CAL.slice(0, 6).map(function (c) {
    return '<div class="r"><div class="d">' + esc(c[0]) + '</div><div class="t">' + esc(c[1]) + '</div><a class="l" href="' + esc(byId[c[2]].url) + '" target="_blank" rel="noopener">원문 ↗</a></div>';
  }).join('');
  return '<section class="hero"><span class="field f1"></span><span class="field f2"></span><span class="field f3"></span><div>' +
    '<p class="eyebrow">Partner Only · AI Trend Service</p><h1>AI 동향<br>10월호</h1>' +
    '<p class="sub">LLM, 에이전트, 이미지, 영상, 논문, 이슈, 책쓰기, 목회까지. 9월 말까지 확인된 동향과 10월에 기다릴 일을 출처와 함께 정리했습니다.</p>' +
    '<p class="from">2026.09.30 기준 · 제공 <b>목회 AI 연구소</b></p></div>' +
    '<div class="logo"><img data-logo alt="목회 AI 연구소 AI와 십자가 로고"></div></section>' +

    '<section class="sec"><div class="sechead"><div><p class="eyebrow">Summary</p><h2>한눈에 보기</h2></div></div>' +
    '<p class="lead">9월은 모델과 에이전트의 출시가 몰렸고, 목회 현장에서는 교단들이 AI 기준을 세우기 시작했습니다. 10월에는 아직 뉴스가 없어 일정이 정해진 행사와 미확정 소식을 구분해 담았습니다.</p>' +
    '<div class="two"><div class="key"><span class="t">English</span><p>September 2026 brought a wave of frontier releases: Anthropic\'s Claude 5.5 family, OpenAI\'s GPT-6 line, Google\'s Gemini 3.8 with Gemini 4 confirmed but undated, xAI\'s Grok 4.7, DeepSeek V4.1-Flash and Alibaba\'s Qwen3.8-Omni-Flash. In agents, GitHub Copilot and Salesforce moved fast, while the BragJack attack showed that AI browser agents can be hijacked through extensions. Sony and UMG sued Suno for up to $9 billion, and OpenAI closed the Sora API on Sept 24. In ministry, the Presbyterian Church of Korea (Hapdong) adopted a ten-principle AI guideline, a second Korean denomination started drafting ethics standards, a Korean survey found 79.9% of Christians who consulted AI on faith questions called it helpful, and Pope Leo XIV warned about AI at UNESCO. October has no news yet: it holds dated events such as the Nobel announcements (Oct 5–12), a Frankfurt Book Fair AI panel (Oct 7) and Calvin University\'s faith-and-AI conference (Oct 8–10), plus unconfirmed items such as Anthropic\'s reported IPO plan.</p></div>' +
    '<div class="key"><span class="t">한국어</span><p>9월에는 Anthropic의 Claude 5.5 계열, OpenAI의 GPT-6 계열, 구글 Gemini 3.8(Gemini 4는 예고만 있고 날짜 미정), xAI Grok 4.7, DeepSeek V4.1-Flash, 알리바바 Qwen3.8-Omni-Flash 등 출시가 몰렸습니다. 에이전트 분야에서는 GitHub Copilot과 Salesforce가 빠르게 움직였고, BragJack 공격으로 확장 프로그램을 통한 AI 브라우저 에이전트 탈취가 가능함이 드러났습니다. 소니와 UMG가 Suno에 최대 90억 달러 규모 소송을 냈고 OpenAI는 9월 24일 Sora API를 종료했습니다. 목회 분야에서는 예장 합동이 10개 원칙의 AI 지침을 채택했고 기장이 윤리기준 제정에 착수했으며, 목회데이터연구소 조사에서는 AI와 신앙 상담을 해 본 개신교인의 79.9%가 도움이 됐다고 답했습니다. 교황 레오 14세는 유네스코에서 AI를 경고했습니다. 10월은 노벨상 발표(5~12일), 프랑크푸르트 도서전 AI 패널(7일), 칼빈대 신앙·AI 컨퍼런스(8~10일) 같은 일정이 정해져 있고, Anthropic 상장 추진 보도처럼 확정되지 않은 소식이 있습니다.</p></div></div></section>' +

    '<section class="sec"><div class="sechead"><div><p class="eyebrow">Headlines</p><h2>이달의 주요 소식</h2></div></div><div class="list">' + heads + '</div></section>' +
    '<section class="sec"><div class="sechead"><div><p class="eyebrow">Sections</p><h2>영역별로 보기</h2></div></div><div class="dom">' + dom + '</div></section>' +
    '<section class="sec"><div class="sechead"><div><p class="eyebrow">October Calendar</p><h2>10월 일정</h2></div><a class="more" href="#calendar" data-go="calendar">전체 캘린더 보기</a></div><div class="cal">' + cal + '</div></section>' +
    trust();
}

function trust() {
  return '<section class="sec"><div><p class="eyebrow">How to read</p><h2>표시 읽는 법</h2></div>' +
    '<p class="note"><b>출처 등급</b> ' + pill('공식', 'blue') + ' 회사·기관·학회의 공식 페이지 ' + pill('언론', '') + ' 언론·전문 매체 ' + pill('집계', 'dash') + ' 릴리스 집계·해설 사이트. 집계 등급 항목은 공식 페이지로 다시 확인하는 것이 좋습니다.</p>' +
    '<p class="note"><b>10월 전망 표시</b> ' + pill('공식 예고', 'blue') + ' 발표 주체가 밝힌 일정 ' + pill('보도·소문', 'dash') + ' 매체 보도나 미확인 정보 ' + pill('연구소 추정', 'soft') + ' 공개된 사실에서 연구소가 추론한 것</p>' +
    '<p class="note"><b>확인 필요</b> 출처끼리 내용이 다르거나 날짜를 추정한 항목에 붙였습니다. 모든 링크는 조사 과정에서 열어 본 페이지이고, 열지 못한 페이지의 내용은 싣지 않았습니다. 편집 단계에서 대표 4건(목회데이터연구소 조사, 예장 합동 지침, GitHub Copilot의 GPT-6.1 Sol, 출판 12개 단체 원칙)을 다시 열어 대조했고 모두 일치했습니다. 나머지는 재대조하지 않았습니다.</p>' +
    '<p class="note"><b>범위</b> 10월의 실제 뉴스는 아직 나오지 않았습니다. 이 호는 9월 30일까지의 동향과 10월 전망이며, 10월 소식은 주 단위로 덧붙이는 방식으로 갱신할 수 있습니다.</p></section>';
}

function domView(k) {
  var d = DN[k], p = past(k), o = outl(k);
  var kinds = {}; p.forEach(function (x) { kinds[x.k] = 1; });
  var ks = Object.keys(kinds);
  var chips = ks.length > 1 ? '<div class="chips" role="group" aria-label="종류">' +
    [['all','전체']].concat(ks.map(function (z) { return [z, KIND[z]]; })).map(function (c) {
      return '<button type="button" data-kind="' + c[0] + '" aria-pressed="' + (state.kind === c[0]) + '">' + esc(c[1]) + '</button>';
    }).join('') + '</div>' : '';
  var shown = state.kind === 'all' ? p : p.filter(function (x) { return x.k === state.kind; });
  return '<div class="viewhead"><p class="eyebrow">' + esc(d.n) + '</p><h2>' + esc(d.n) + ' 동향</h2><p class="lead">' + esc(d.d) + '. 최근 동향 ' + p.length + '건과 10월 전망 ' + o.length + '건입니다.</p>' + chips + '</div>' +
    '<section class="sec" style="border-top:0;padding-top:16px"><div><p class="eyebrow">Sept 2026</p><h3 style="font-size:20px">최근 동향 (9월 중심)</h3></div><div class="list">' + (shown.map(function (x) { return row(x, false); }).join('') || '<div class="empty">해당하는 항목이 없습니다.</div>') + '</div></section>' +
    '<section class="sec"><div><p class="eyebrow">October Outlook</p><h3 style="font-size:20px">10월 예상과 대기 중인 것</h3></div><div class="list">' + o.map(function (x) { return orow(x, false); }).join('') + '</div></section>';
}

function calView() {
  var rows = CAL.map(function (c) {
    var x = byId[c[2]];
    return '<div class="r"><div class="d">' + esc(c[0]) + '</div><div class="t">' + esc(c[1]) + '<small>' + esc(DN[x.d].n) + ' · ' + esc(x.src) + '</small></div><a class="l" href="' + esc(x.url) + '" target="_blank" rel="noopener">원문 열기 ↗</a></div>';
  }).join('');
  var und = ITEMS.filter(function (x) { return x.k === 'outlook' && x.st !== 'confirmed'; }).concat(ITEMS.filter(function (x) { return x.k === 'outlook' && x.st === 'confirmed' && /미정|불투명/.test(x.when); }));
  var seen = {}; und = und.filter(function (x) { if (seen[x.id]) return false; seen[x.id] = 1; return true; });
  var u = und.map(function (x) {
    var st = STAT[x.st] || STAT.inference;
    return '<div class="r"><div>' + pill(st[0], st[1]) + '</div><div><b style="color:var(--navy)">' + esc(x.t) + '</b> <span style="color:var(--muted);font-size:13px">' + esc(DN[x.d].n) + ' · ' + esc(x.when) + '</span> <a href="' + esc(x.url) + '" target="_blank" rel="noopener" style="font-size:13px;font-weight:700">원문 ↗</a></div></div>';
  }).join('');
  return '<div class="viewhead"><p class="eyebrow">Calendar</p><h2>10월 캘린더</h2><p class="lead">날짜가 확인된 일정과, 시점이 정해지지 않은 전망을 나누어 보여 줍니다.</p></div>' +
    '<section class="sec" style="border-top:0;padding-top:16px"><h3 style="font-size:20px">날짜가 확인된 일정</h3><div class="cal">' + rows + '</div><p class="note">노벨상 발표 시각은 중부유럽 현지 기준입니다. 학회 일정은 각 공식 페이지의 최신 공지를 확인해 주세요.</p></section>' +
    '<section class="sec"><h3 style="font-size:20px">시점 미정 · 소문 · 추정</h3><div class="und">' + u + '</div></section>';
}

function srcView() {
  var g = DOMS.map(function (d) {
    var xs = ITEMS.filter(function (x) { return x.d === d.k; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return xs.map(function (x, i) {
      var t = TIER[x.tier];
      return '<div class="r"><div class="g">' + (i === 0 ? esc(d.n) : '') + '</div><div><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.t) + '</a> <span style="color:var(--muted);font-size:13px">' + esc(x.src) + '</span></div><div>' + pill(t[0], t[1]) + '</div></div>';
    }).join('');
  }).join('');
  return '<div class="viewhead"><p class="eyebrow">Sources</p><h2>출처 모음</h2><p class="lead">이 호에 실린 ' + ITEMS.length + '건의 원문 링크입니다. 모두 새 탭에서 열립니다.</p></div>' +
    '<section class="sec" style="border-top:0;padding-top:16px"><div class="src">' + g + '</div></section>' + trust();
}

function searchView() {
  var q = state.q.toLowerCase();
  var hit = ITEMS.filter(function (x) { return (x.t + ' ' + x.s + ' ' + x.src + ' ' + x.tags.join(' ') + ' ' + DN[x.d].n).toLowerCase().indexOf(q) > -1; })
    .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  return '<div class="viewhead"><p class="eyebrow">Search</p><h2>「' + esc(state.q) + '」 검색 결과 ' + hit.length + '건</h2></div>' +
    '<section class="sec" style="border-top:0;padding-top:16px"><div class="list">' + (hit.map(function (x) { return x.k === 'outlook' ? orow(x, true) : row(x, true); }).join('') || '<div class="empty">일치하는 항목이 없습니다.</div>') + '</div></section>';
}

function render() {
  tabs();
  var v = document.getElementById('view'), h;
  if (state.q) h = searchView();
  else if (state.view === 'home') h = homeView();
  else if (state.view === 'calendar') h = calView();
  else if (state.view === 'sources') h = srcView();
  else h = domView(state.view);
  v.innerHTML = h;
  setLogos();
}

function go(view, keepScroll) {
  state.view = view; state.kind = 'all'; state.q = '';
  document.getElementById('q').value = '';
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch (e) {}
  render();
  if (!keepScroll) window.scrollTo(0, 0);
}
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.getAttribute('data-go')); return; }
  var k = e.target.closest('[data-kind]');
  if (k) { state.kind = k.getAttribute('data-kind'); render(); }
});
document.getElementById('q').addEventListener('input', function (e) {
  state.q = e.target.value.trim();
  render();
});
var valid = {home:1, calendar:1, sources:1}; DOMS.forEach(function (d) { valid[d.k] = 1; });
var h0 = (location.hash || '').replace('#', '');
state.view = valid[h0] ? h0 : 'home';
render();
setLogos();
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#', '');
  if (valid[h] && h !== state.view) go(h);
});
</script>

</body>
</html>
